name: quyosh24
description: Quyosh24 - Quyosh paneli yechimlari

publish_to: "none"

version: 2.1.0+10

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.2
  url_launcher: ^6.1.0
  http: ^1.1.0
  version: ^2.0.0
  shared_preferences: ^2.2.2
  package_info_plus: ^4.0.0
  connectivity_plus: ^5.0.1
  dio: ^5.3.2
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  video_player: ^2.8.1
  chewie: ^1.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    # Main assets
    - assets/images/icon.png
    - assets/images/1233.jpg
    - assets/videos/
    - assets/videos/intro.mp4

    # Ads (50+ yangi rasm - CopiaApk dan!)
    - assets/images/ads/

    # Panels (CopiaApk dan yangi rasmlar)
    - assets/images/panels/

    # Inverters (CopiaApk dan yangi rasmlar)
    - assets/images/inverters/

    # Modules (CopiaApk dan yangi rasmlar)
    - assets/images/modullar/

    # Solar Stations (yangi bo'lim!)
    - assets/images/solar_station/1.jpg
    - assets/images/solar_station/2.jpg
    - assets/images/solar_station/3.jpg
    - assets/images/solar_station/4.jpg
    - assets/images/solar_station/5.jpg
    - assets/images/solar_station/6.jpg
    - assets/images/solar_station/7.jpg

    # YouTube icons
    - assets/images/icon_youtube/1.png
    - assets/images/modullar/photo_2025-11-07_21-55-25 (2).jpg
    - assets/images/modullar/photo_2025-11-07_21-55-25 (3).jpg
    - assets/images/modullar/photo_2025-11-07_21-55-25.jpg
    - assets/images/modullar/photo_2025-11-07_23-00-32.jpg
    - assets/images/modullar/photo_2025-11-07_23-00-43.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
